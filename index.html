    <style>
        /* ===== RESET & PALETA (BLANCO Y NEGRO MEJORADA) ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html { scroll-behavior: smooth; }

        body {
            background-image: url('https://i.postimg.cc/L5T78935/ae222d52c1f501d06caefbc46e09f1f3.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #0a0a0a;
            color: #d0d0d0;
            padding: 16px 16px 100px 16px;
            min-height: 100vh;
            animation: bodyFadeIn 0.9s ease;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.035), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        @keyframes bodyFadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .container { max-width: 1400px; margin: 0 auto; position: relative; z-index: 1; }

        /* --- HEADER MEJORADO --- */
        header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            animation: fadeDown 0.9s cubic-bezier(0.23, 1, 0.32, 1);
            padding: 22px 0 14px;
            border-bottom: 1px solid rgba(200,200,200,0.15);
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #999, transparent);
            animation: lineShine 3.5s ease-in-out infinite;
        }

        @keyframes lineShine {
            0%, 100% { opacity: 0.3; width: 140px; }
            50% { opacity: 1; width: 220px; }
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header h1 {
            font-size: 2.9rem;
            font-weight: 700;
            letter-spacing: -1px;
            text-shadow: 2px 2px 12px rgba(0,0,0,0.95);
            margin-bottom: 2px;
            color: #ececec;
            animation: glowText 4s ease-in-out infinite;
        }

        @keyframes glowText {
            0%, 100% { text-shadow: 2px 2px 12px rgba(0,0,0,0.95); }
            50% { text-shadow: 2px 2px 28px rgba(220,220,220,0.22), 0 0 55px rgba(220,220,220,0.08); }
        }

        header p {
            font-size: 0.9rem;
            color: #999;
            font-weight: 300;
            margin-bottom: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: fadeUp 1.2s ease;
        }

        .logo-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: floatLogo 5s ease-in-out infinite;
            filter: drop-shadow(0 0 15px rgba(200,200,200,0.12));
        }

        @keyframes floatLogo {
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
            50% { transform: translateY(-8px) scale(1.03) rotate(-3deg); }
        }

        .logo-icon img {
            width: 100%; height: 100%;
            object-fit: contain;
            border: none;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.4s ease;
        }

        .logo-icon img:hover {
            transform: scale(1.12) rotate(-8deg);
            filter: drop-shadow(0 0 22px rgba(220,220,220,0.35));
        }

        /* --- SEARCH MEJORADO --- */
        .search-container {
            width: 100%;
            max-width: 500px;
            margin: 10px auto 30px auto;
            position: relative;
            animation: fadeUp 1s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .search-container input {
            width: 100%;
            padding: 13px 20px 13px 45px;
            background-color: rgba(20, 20, 20, 0.88);
            border: 1px solid #3a3a3a;
            border-radius: 50px;
            color: #d0d0d0;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04);
        }

        .search-container input::placeholder { color: #666; letter-spacing: 0.5px; }

        .search-container input:focus {
            border-color: #999;
            background-color: rgba(35, 35, 35, 0.95);
            box-shadow: 0 0 28px rgba(200,200,200,0.14), 0 0 75px rgba(200,200,200,0.04), inset 0 1px 0 rgba(255,255,255,0.06);
            transform: scale(1.02);
        }

        .search-container::before {
            content: "🔍";
            position: absolute;
            left: 18px; top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            opacity: 0.6;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 2;
        }

        .search-container:focus-within::before { opacity: 1; transform: translateY(-50%) scale(1.1); }

        /* --- GRID ÚNICO --- */
        #main-grid {
            display: grid;
            gap: 26px;
            grid-template-columns: repeat(2, 1fr);
            padding-top: 20px;
        }

        @media (min-width: 768px) { #main-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (min-width: 1024px) { #main-grid { grid-template-columns: repeat(6, 1fr); } }

        /* --- TARJETAS MEJORADAS --- */
        .card {
            background: linear-gradient(145deg, rgba(28,28,28,0.96), rgba(16,16,16,0.96));
            border: 1px solid rgba(200, 200, 200, 0.09);
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.55s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: pointer;
            box-shadow: 0 6px 26px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.03);
            position: relative;
            animation: cardFadeUp 0.9s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            opacity: 0;
            transform: translateY(35px) scale(0.95);
            will-change: transform, opacity;
        }

        .card::after {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 20px;
            background: linear-gradient(45deg, transparent, rgba(220,220,220,0.08), transparent);
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
            z-index: 0;
        }

        .card:hover::after { opacity: 1; }

        .card:nth-child(1) { animation-delay: 0.05s; }
        .card:nth-child(2) { animation-delay: 0.10s; }
        .card:nth-child(3) { animation-delay: 0.15s; }

        .card:nth-child(37) { animation-delay: 1.85s; }
        .card:nth-child(38) { animation-delay: 1.90s; }

        @keyframes cardFadeUp {
            from { opacity: 0; transform: translateY(35px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card:hover {
            transform: translateY(-12px) scale(1.03);
            border-color: #777;
            box-shadow: 0 22px 55px rgba(0, 0, 0, 0.85), 0 0 35px rgba(210, 210, 210, 0.10);
        }

        .card-img-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 2/3;
            overflow: hidden;
            background: #111;
        }

        .card-img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1), filter 0.4s ease;
            will-change: transform;
        }

        .card:hover .card-img {
            transform: scale(1.08);
            filter: brightness(1.12) contrast(1.06);
        }

        .card-title-overlay {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%;
            padding: 18px 12px 12px;
            background: linear-gradient(to top, rgba(0,0,0,0.96) 0%, rgba(0,0,0,0) 100%);
            color: #e5e5e5;
            font-weight: 600;
            font-size: 0.9rem;
            line-height: 1.2;
            text-shadow: 0 1px 5px rgba(0,0,0,0.95);
            pointer-events: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            z-index: 1;
            transition: transform 0.3s ease, padding 0.3s ease;
        }

        .card:hover .card-title-overlay { transform: translateY(-3px); padding-bottom: 16px; }

        .card-badge {
            position: absolute;
            top: 10px; left: 10px;
            font-size: 10px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            box-shadow: 0 0 22px rgba(0,0,0,0.7);
            z-index: 2;
            text-shadow: 0 0 5px currentColor;
            animation: pulseBadge 2.5s ease-in-out infinite;
        }

        @keyframes pulseBadge {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.08); }
        }

        .badge-hot { background: #ff4757; color: #fff; box-shadow: 0 0 26px rgba(255, 71, 87, 0.55); }
        .badge-new { background: #2ed573; color: #fff; box-shadow: 0 0 26px rgba(46, 213, 115, 0.45); }

        /* ===== BARRA DE NAVEGACIÓN ===== */
        .bottom-nav {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(28, 28, 28, 0.82);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            padding: 6px;
            border-radius: 60px;
            display: flex;
            gap: 4px;
            border: 1px solid rgba(200, 200, 200, 0.16);
            box-shadow: 0 10px 38px rgba(0, 0, 0, 0.7);
            z-index: 1000;
            min-width: 280px;
            max-width: 90%;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            animation: fadeUp 1s ease;
        }

        .nav-btn {
            background: transparent;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 6px 14px;
            border-radius: 40px;
            color: #aaa;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .nav-btn:active { animation: clickPulse 0.3s ease; }

        @keyframes clickPulse {
            0% { transform: scale(1); }
            30% { transform: scale(0.95); }
            60% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .nav-btn svg {
            width: 22px; height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.3s ease;
        }

        .nav-icon-img {
            width: 22px; height: 22px;
            filter: brightness(0) invert(0.7);
            opacity: 0.7;
            transition: all 0.3s ease;
            object-fit: contain;
        }

        .nav-btn .label {
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: capitalize;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            color: #e5e5e5;
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.04);
        }

        .nav-btn:hover .nav-icon-img {
            opacity: 1;
            filter: brightness(0) invert(1);
            transform: scale(1.1);
        }

        .nav-btn.active {
            background: rgba(200, 200, 200, 0.12);
            backdrop-filter: blur(4px);
            color: #e5e5e5;
            border: 1px solid rgba(200, 200, 200, 0.22);
            box-shadow: 0 0 28px rgba(200, 200, 200, 0.06);
            transform: translateY(-3px);
        }

        .nav-btn.active .nav-icon-img { opacity: 1; filter: brightness(0) invert(1); }
        .nav-btn.active .label { color: #e5e5e5; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .nav-btn .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            transform: scale(0);
            animation: rippleAnim 0.5s linear;
            pointer-events: none;
        }

        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.93);
            backdrop-filter: blur(14px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-overlay.closing { opacity: 0; transition: opacity 0.4s ease; }

        .modal-content {
            background: linear-gradient(160deg, #1e1e1e, #141414);
            border: 1px solid #3a3a3a;
            width: 100%;
            max-width: 850px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px 25px;
            border-radius: 22px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.95), inset 0 1px 0 rgba(255,255,255,0.04);
            animation: modalIn 0.5s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transform: scale(0.95);
            opacity: 0;
        }

        .modal-overlay.active .modal-content { animation: modalIn 0.5s cubic-bezier(0.23, 1, 0.32, 1) forwards; }
        .modal-overlay.closing .modal-content { animation: modalOut 0.4s cubic-bezier(0.23, 1, 0.32, 1) forwards; }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes modalOut {
            from { opacity: 1; transform: scale(1) translateY(0); }
            to { opacity: 0; transform: scale(0.95) translateY(30px); }
        }

        .modal-close {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 2rem;
            cursor: pointer;
            color: #666;
            transition: all 0.3s ease;
            background: none;
            border: none;
            line-height: 1;
            z-index: 10;
        }

        .modal-close:hover { color: #e5e5e5; transform: rotate(90deg) scale(1.2); }

        .modal-title {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 5px;
            margin-bottom: 15px;
            color: #ececec;
            text-shadow: 0 0 20px rgba(255,255,255,0.03);
            text-align: center;
            letter-spacing: -0.5px;
        }

        .modal-img {
            width: 100%;
            max-width: 700px;
            border-radius: 14px;
            margin-bottom: 20px;
            object-fit: contain;
            max-height: 60vh;
            box-shadow: 0 10px 35px rgba(0,0,0,0.7);
            transition: transform 0.4s ease;
        }

        .modal-img:hover { transform: scale(1.02); }

        .modal-desc {
            font-size: 1rem;
            color: #b5b5b5;
            margin-bottom: 20px;
            line-height: 1.65;
            max-width: 650px;
            text-align: center;
            background: rgba(255,255,255,0.025);
            padding: 14px 20px;
            border-radius: 12px;
            border-left: 3px solid #555;
        }

        .modal-reqs {
            font-size: 0.85rem;
            color: #a5a5a5;
            margin-bottom: 20px;
            padding: 10px 16px;
            background: #262626;
            border-radius: 8px;
            border: 1px solid #444;
            white-space: pre-wrap;
            max-width: 650px;
            width: 100%;
            text-align: center;
        }

        .modal-links {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            max-width: 650px;
            width: 100%;

        function renderContent() {
            const container = document.getElementById('main-grid');
            container.innerHTML = '';

            let allItems = [];
            movies.forEach(item => { allItems.push({ ...item, type: 'movie' }); });
            fromSeasons.forEach(season => {
                const item = {
                    title: season.title,
                    poster: season.poster,
                    screen: 'https://hips.hearstapps.com/hmg-prod/images/from-temporada-2-649ec0a7cb33a.jpg?crop=1xw:0.845427435387674xh;center,top&resize=1200:*',
                    links: season.links,
                    desc: season.desc,
                    reqs: season.reqs,
                    type: 'movie'
                };
                allItems.push(item);
            });
            games.forEach(item => { allItems.push({ ...item, type: 'game' }); });

            allItems.sort((a, b) => {
                const getWeight = (item) => {
                    if (item.showNewBadge) return 100;
                    if (item.id === 'p5') return 25;
                    return 0;
                };
                return getWeight(b) - getWeight(a);
            });

            allItems.forEach(item => {
                const link = item.type === 'game' ? (item.link || '#') : (item.links ? (item.links.mex || item.links.usa || '#') : '#');
                const card = createCard(item, item.type, link);
                container.appendChild(card);
            });

            filterCards();
        }

        function createCard(item, type, baseLink) {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.type = type;
            card.dataset.search = (item.title || '').toLowerCase();

            const imgWrapper = document.createElement('div');
            imgWrapper.className = 'card-img-wrapper';

            const img = document.createElement('img');
            img.className = 'card-img';
            img.src = item.poster || item.screen || 'https://via.placeholder.com/300x400?text=Sin+Poster';
            img.alt = item.title;
            img.loading = 'lazy';
            imgWrapper.appendChild(img);

            if (item.id === 'p5') {
                const badge = document.createElement('div');
                badge.className = 'card-badge badge-hot';
                badge.textContent = 'Hot';
                imgWrapper.appendChild(badge);
            } else if (item.showNewBadge) {
                const badge = document.createElement('div');
                badge.className = 'card-badge badge-new';
                badge.textContent = 'New';
                imgWrapper.appendChild(badge);
            }

            const titleOverlay = document.createElement('div');
            titleOverlay.className = 'card-title-overlay';
            titleOverlay.textContent = item.title;
            imgWrapper.appendChild(titleOverlay);

            card.appendChild(imgWrapper);

            card.addEventListener('click', function() { openModal(item, type); });

            return card;
        }

        function openModal(item, type) {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modalTitle');
            const img = document.getElementById('modalImg');
            const desc = document.getElementById('modalDesc');
            const reqs = document.getElementById('modalReqs');
            const links = document.getElementById('modalLinks');

            if (!modal || !title || !img || !desc || !reqs || !links) { return; }

            modal.classList.remove('closing');
            modal.classList.add('active');

            title.textContent = item.title;
            img.src = item.screen || item.poster || 'https://via.placeholder.com/300x400?text=Sin+Captura';
            img.alt = item.title;

            desc.textContent = item.desc || 'Descripción no disponible.';

            if (item.reqs && item.reqs.length > 0) { reqs.textContent = item.reqs.join(' • '); }
            else { reqs.textContent = 'No hay requisitos específicos.'; }

            links.innerHTML = '';

            if (type === 'game') {
                if (item.link && item.link !== '#') {
                    const btn = document.createElement('a');
                    btn.className = 'modal-link-btn primary';
                    btn.href = item.link;
                    btn.target = '_blank';
                    btn.textContent = '⬇️ Descargar APK';
                    btn.onclick = function(e) { notifyDownload(item, type); };
                    links.appendChild(btn);
                } else { links.innerHTML = `<p style="color:#555;">Enlace no disponible</p>`; }
            } else {
                if (item.links) {
                    if (item.links.mex && item.links.mex !== 'No disponible en español') {
                        const btnMex = document.createElement('a');
                        btnMex.className = 'modal-link-btn';
                        btnMex.href = item.links.mex;
                        btnMex.target = '_blank';
                        btnMex.innerHTML = `<span class="flag-icon">🇲🇽</span> Latino`;
                        btnMex.onclick = function(e) { notifyDownload(item, type); };
                        links.appendChild(btnMex);
                    }
                    if (item.links.usa && !item.noEnglish) {
                        const btnUsa = document.createElement('a');
                        btnUsa.className = 'modal-link-btn';
                        btnUsa.href = item.links.usa;
                        btnUsa.target = '_blank';
                        btnUsa.innerHTML = `<span class="flag-icon">🇺🇸</span> Inglés`;
                        btnUsa.onclick = function(e) { notifyDownload(item, type); };
                        links.appendChild(btnUsa);
                    }
                    if (!item.links.mex && !item.links.usa) { links.innerHTML = `<p style="color:#555;">Enlace no disponible</p>`; }
                } else { links.innerHTML = `<p style="color:#555;">Enlace no disponible</p>`; }
            }

            modal.style.display = 'flex';
            setTimeout(() => { modal.classList.add('active'); }, 10);
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.remove('active');
            modal.classList.add('closing');
            setTimeout(() => {
                modal.style.display = 'none';
                modal.classList.remove('closing');
            }, 400);
            document.body.style.overflow = '';
        }

        function filterCards() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const activeFilter = document.querySelector('.nav-btn.active');
            let category = activeFilter ? activeFilter.dataset.filter : 'all';

            const allCards = document.querySelectorAll('.card');
            allCards.forEach(card => {
                let visible = true;
                const title = (card.dataset.search || '');
                if (searchTerm && !title.includes(searchTerm)) { visible = false; }
                if (visible && category !== 'all') {
                    if (category === 'movies' && card.dataset.type !== 'movie') visible = false;
                    if (category === 'games' && card.dataset.type !== 'game') visible = false;
                    if (category === 'requests') visible = false;
                }
                card.style.display = visible ? 'flex' : 'none';
            });

            if (category === 'requests') {
                document.getElementById('main-grid').style.display = 'none';
                document.getElementById('requests-container').classList.add('active');
            } else {
                document.getElementById('main-grid').style.display = 'grid';
                document.getElementById('requests-container').classList.remove('active');
            }
        }

        document.getElementById('searchInput').addEventListener('input', filterCards);

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const filter = this.dataset.filter;

                if (filter === 'app') {
                    window.open('https://apk.e-droid.net/apk/app4077278-ne4cwy.apk?v=6', '_blank');
                    return;
                }

                const ripple = document.createElement('span');
                ripple.classList.add('ripple');
                const rect = this.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
                ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 500);

                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                filterCards();
            });
        });

        document.getElementById('sendRequestBtn').addEventListener('click', function() {
            const text = document.getElementById('requestText').value.trim();
            const status = document.getElementById('request-status');
            if (!text) {
                status.textContent = '❌ Escribe algo antes de enviar.';
                status.style.color = '#888';
                return;
            }

            const embed = {
                title: "📩 Nueva Petición",
                color: 0x888888,
                fields: [
                    { name: "👤 Usuario", value: "Anónimo", inline: true },
                    { name: "📝 Contenido", value: text, inline: false }
                ],
                footer: { text: "Plevark • Petición recibida" }
            };

            sendWebhookBackground(WEBHOOK_REQUESTS, { embeds: [embed] });
            status.textContent = '✅ Petición enviada con éxito.';
            status.style.color = '#aaa';
            document.getElementById('requestText').value = '';
            setTimeout(() => { status.textContent = ''; }, 4000);
        });

        document.getElementById('modalClose').addEventListener('click', closeModal);

        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) { closeModal(); }
        });

        document.addEventListener('DOMContentLoaded', function() {
            renderContent();
            filterCards();
        });

        window.addEventListener('beforeunload', () => {
            sessionStorage.setItem('scrollPosition', window.scrollY);
        });

        window.addEventListener('load', () => {
            const scrollPos = sessionStorage.getItem('scrollPosition');
            if (scrollPos) {
                window.scrollTo(0, parseInt(scrollPos));
                sessionStorage.removeItem('scrollPosition');
            }
        });
    </script>
</body>
    </html>
